name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: v0.1.0-p0

jobs:
  go:
    name: Go 质量与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: 代码格式检查
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "以下文件未格式化："; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: 单元测试
        run: go test ./... -v -count=1
      - name: 静态编译（无 CGO）
        run: CGO_ENABLED=0 go build -trimpath -o bin/localhub ./cmd/localhub

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: 类型检查与构建
        working-directory: web
        run: npm run build

  image:
    name: 多架构镜像与 T12 验证
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 QEMU（arm64 运行）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 linux/amd64 镜像
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="${{ github.sha }}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha,scope=amd64 --cache-to type=gha,mode=max,scope=amd64 \
            -t localhub:amd64 .

      - name: 构建 linux/arm64 镜像
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="${{ github.sha }}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha,scope=arm64 --cache-to type=gha,mode=max,scope=arm64 \
            -t localhub:arm64 .

      - name: 记录镜像信息
        run: |
          mkdir -p ci-artifacts
          docker image inspect localhub:amd64 localhub:arm64 > ci-artifacts/image-inspect.json
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | tee ci-artifacts/images.txt
          docker run --rm --platform linux/amd64 localhub:amd64 /localhub --version | tee ci-artifacts/version-amd64.txt
          docker run --rm --platform linux/arm64 localhub:arm64 /localhub --version | tee ci-artifacts/version-arm64.txt

      - name: T12 专项验证（amd64）
        run: |
          chmod +x scripts/t12.sh
          bash scripts/t12.sh localhub:amd64 linux/amd64 2>&1 | tee ci-artifacts/t12.log
          test ${PIPESTATUS[0]} -eq 0

      - name: arm64 运行验证（QEMU）
        run: |
          rm -rf .ci-data && mkdir -p .ci-data
          docker run -d --name lh-arm64 --platform linux/arm64 \
            -p 18085:11030 -v "$PWD/.ci-data:/data" \
            -e PUID=1000 -e PGID=1000 localhub:arm64
          for i in $(seq 1 40); do
            code=$(curl -s -o ci-artifacts/health-arm64.json -w '%{http_code}' http://127.0.0.1:18085/health || true)
            [ "$code" = "200" ] && break
            sleep 0.5
          done
          echo "arm64 /health HTTP $code"
          cat ci-artifacts/health-arm64.json
          docker kill -s TERM lh-arm64
          sleep 2
          docker inspect -f 'exit_code={{.State.ExitCode}}' lh-arm64 | tee ci-artifacts/arm64-exit.txt
          test "$code" = "200"
          test "$(docker inspect -f '{{.State.ExitCode}}' lh-arm64)" = "0"

      - name: 上传验证记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-verification-${{ github.sha }}
          path: ci-artifacts
          if-no-files-found: warn
