name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: v0.1.0-p0

jobs:
  go:
    name: Go 质量与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: 代码格式检查
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "以下文件未格式化："; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: 单元测试
        run: go test ./... -v -count=1
      - name: 静态编译（无 CGO）
        run: CGO_ENABLED=0 go build -trimpath -o bin/localhub ./cmd/localhub

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: 前端单元测试
        working-directory: web
        run: npm test
      - name: 类型检查与构建
        working-directory: web
        run: npm run build

  image:
    name: 多架构镜像与 T12 验证
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 QEMU（arm64 运行）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 linux/amd64 镜像
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="${{ github.sha }}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha,scope=amd64 --cache-to type=gha,mode=max,scope=amd64 \
            -t localhub:amd64 .

      - name: 构建 linux/arm64 镜像
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="${{ github.sha }}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha,scope=arm64 --cache-to type=gha,mode=max,scope=arm64 \
            -t localhub:arm64 .

      - name: 记录镜像信息
        run: |
          mkdir -p ci-artifacts
          docker image inspect localhub:amd64 localhub:arm64 > ci-artifacts/image-inspect.json
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | tee ci-artifacts/images.txt
          set -o pipefail
          docker run --rm --platform linux/amd64 localhub:amd64 --version | tee ci-artifacts/version-amd64.txt
          docker run --rm --platform linux/arm64 localhub:arm64 --version | tee ci-artifacts/version-arm64.txt

      - name: T12 专项验证（amd64）
        run: |
          chmod +x scripts/t12.sh
          T12_ARTIFACT_DIR="$PWD/ci-artifacts/t12-logs" \
            timeout 600 bash scripts/t12.sh localhub:amd64 linux/amd64 2>&1 | tee ci-artifacts/t12.log
          test ${PIPESTATUS[0]} -eq 0

      - name: arm64 运行验证（QEMU）
        run: |
          rm -rf .ci-data && mkdir -p .ci-data
          docker run -d --name lh-arm64 --platform linux/arm64 \
            -p 18085:11030 -v "$PWD/.ci-data:/data" \
            -e PUID=1000 -e PGID=1000 localhub:arm64
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s --max-time 2 -o ci-artifacts/health-arm64.json -w '%{http_code}' http://127.0.0.1:18085/health || true)
            [ "$code" = "200" ] && break
            sleep 0.5
          done
          echo "arm64 /health HTTP $code"
          cat ci-artifacts/health-arm64.json
          docker kill -s TERM lh-arm64
          sleep 2
          docker inspect -f 'exit_code={{.State.ExitCode}}' lh-arm64 | tee ci-artifacts/arm64-exit.txt
          test "$code" = "200"
          test "$(docker inspect -f '{{.State.ExitCode}}' lh-arm64)" = "0"

      - name: Docker Compose 启动与健康检查
        run: |
          rm -rf .ci-compose && mkdir -p .ci-compose
          export LOCALHUB_IMAGE=localhub:amd64
          export LOCALHUB_PORT=18090
          export LOCALHUB_DATA_DIR="$PWD/.ci-compose"
          export LOCALHUB_ADMIN_PASSWORD="Ci-Smoke-Passw0rd!2026"
          # Socket Proxy 以非 root 运行，需要宿主机 Docker Socket 的组号
          export LOCALHUB_DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          echo "docker socket gid=$LOCALHUB_DOCKER_GID"
          docker compose config > ci-artifacts/compose-config.txt
          docker compose up -d 2>&1 | tee ci-artifacts/compose-up.txt
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s --max-time 2 -o ci-artifacts/health-compose.json -w '%{http_code}' http://127.0.0.1:18090/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker compose ps -a | tee ci-artifacts/compose-ps.txt
          echo "compose /health HTTP $code"
          cat ci-artifacts/health-compose.json

          # P1.1 容器级鉴权冒烟：访客 401、登录成功、管理员接口 200、退出后 401
          echo "--- auth smoke ---" | tee ci-artifacts/auth-smoke.txt
          curl -s --max-time 3 http://127.0.0.1:18090/api/auth/status | tee -a ci-artifacts/auth-smoke.txt
          echo >> ci-artifacts/auth-smoke.txt
          guest=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/api/admin/whoami)
          echo "guest whoami HTTP $guest" | tee -a ci-artifacts/auth-smoke.txt
          test "$guest" = "401"
          login=$(curl -s --max-time 5 -c compose-cookies.txt -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$LOCALHUB_ADMIN_PASSWORD\"}" \
            http://127.0.0.1:18090/api/auth/login)
          echo "login HTTP $login" | tee -a ci-artifacts/auth-smoke.txt
          test "$login" = "200"
          who=$(curl -s --max-time 3 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/whoami | tee -a ci-artifacts/auth-smoke.txt)
          echo >> ci-artifacts/auth-smoke.txt
          echo "$who" | grep -q '"role":"admin"'
          # P5.1 Docker 状态鉴权与只读连接：访客 401，管理员 connected
          guest_docker=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/api/admin/docker/status)
          echo "guest docker status HTTP $guest_docker" | tee -a ci-artifacts/auth-smoke.txt
          test "$guest_docker" = "401"
          docker_status=$(curl -s --max-time 5 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/docker/status | tee -a ci-artifacts/auth-smoke.txt)
          echo >> ci-artifacts/auth-smoke.txt
          echo "$docker_status" | grep -q '"status":"connected"'
          echo "$docker_status" | grep -q '"read_only":true'
          if echo "$docker_status" | grep -q 'docker-socket-proxy:2375'; then
            echo "Docker 状态响应泄露了连接地址" >&2
            exit 1
          fi
          # P5.2 真实容器发现：运行中 + 已停止各一个（宿主机 CLI 创建，不经过 LocalHub）
          docker rm -f p52-running p52-stopped >/dev/null 2>&1 || true
          docker run -d --name p52-running --entrypoint sleep alpine:3.20 300 >/dev/null
          docker create --name p52-stopped --entrypoint true alpine:3.20 >/dev/null
          curl -s --max-time 8 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/docker/containers > p52-containers.json
          python3 - <<'PY2' | tee -a ci-artifacts/auth-smoke.txt
          import json
          d=json.load(open('p52-containers.json'))
          assert d["status"]=="connected", d
          assert d["read_only"] is True
          items={c["name"]:c for c in d["containers"]}
          assert "p52-running" in items and items["p52-running"]["status"]=="running", items.keys()
          assert "p52-stopped" in items and items["p52-stopped"]["status"]=="stopped", items.keys()
          assert items["p52-running"]["started_at"], items["p52-running"]
          assert len(items["p52-running"]["id"]) > 12
          assert isinstance(items["p52-running"]["labels"], dict)
          assert isinstance(items["p52-running"]["ports"], list)
          assert d["counts"]["total"] == len(d["containers"])
          assert d["counts"]["running"] >= 1 and d["counts"]["stopped"] >= 1
          print("P5.2 containers:", d["counts"], "names:", sorted(items.keys()))
          PY2
          docker inspect p52-running p52-stopped > ci-artifacts/p52-docker-inspect.json
          logout=$(curl -s --max-time 3 -b compose-cookies.txt -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/api/auth/logout)
          echo "logout HTTP $logout" | tee -a ci-artifacts/auth-smoke.txt
          after=$(curl -s --max-time 3 -b compose-cookies.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/api/admin/whoami)
          echo "after logout whoami HTTP $after" | tee -a ci-artifacts/auth-smoke.txt
          test "$after" = "401"
          wrong=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"username":"admin","password":"wrong-password-12345"}' \
            http://127.0.0.1:18090/api/auth/login)
          echo "wrong password HTTP $wrong" | tee -a ci-artifacts/auth-smoke.txt
          test "$wrong" = "401"
          # P2.2 图标冒烟：上传 → 访客读取 → 容器重启后仍可读 → SSRF 拦截 → 删除清理
          echo "--- icon smoke ---" | tee -a ci-artifacts/icon-smoke.txt
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > ci-icon.png
          icon_sha=$(sha256sum ci-icon.png | awk '{print $1}')
          curl -s --max-time 5 -c compose-cookies.txt -o /dev/null \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$LOCALHUB_ADMIN_PASSWORD\"}" \
            http://127.0.0.1:18090/api/auth/login
          bm=$(curl -s --max-time 5 -b compose-cookies.txt -H 'Content-Type: application/json' \
            -d '{"name":"图标冒烟","wan_url":"https://example.com"}' \
            http://127.0.0.1:18090/api/admin/bookmarks)
          echo "create: $bm" | tee -a ci-artifacts/icon-smoke.txt
          bid=$(echo "$bm" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          up=$(curl -s --max-time 5 -b compose-cookies.txt -X PUT -H 'Content-Type: image/png' \
            --data-binary @ci-icon.png -o icon-up.json -w '%{http_code}' \
            "http://127.0.0.1:18090/api/admin/bookmarks/$bid/icon")
          echo "icon upload HTTP $up body=$(cat icon-up.json)" | tee -a ci-artifacts/icon-smoke.txt
          test "$up" = "200"
          get1=$(curl -s --max-time 5 -o icon-before.png -w '%{http_code}' \
            "http://127.0.0.1:18090/api/bookmarks/$bid/icon")
          echo "icon get before restart HTTP $get1" | tee -a ci-artifacts/icon-smoke.txt
          test "$get1" = "200"
          test "$(sha256sum icon-before.png | awk '{print $1}')" = "$icon_sha"

          docker compose restart >/dev/null 2>&1
          health=000
          for i in $(seq 1 60); do
            health=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/health || true)
            [ "$health" = "200" ] && break
            sleep 1
          done
          echo "after restart /health HTTP $health" | tee -a ci-artifacts/icon-smoke.txt
          test "$health" = "200"
          get2=$(curl -s --max-time 5 -o icon-after.png -w '%{http_code}' \
            "http://127.0.0.1:18090/api/bookmarks/$bid/icon")
          echo "icon get after restart HTTP $get2" | tee -a ci-artifacts/icon-smoke.txt
          test "$get2" = "200"
          test "$(sha256sum icon-after.png | awk '{print $1}')" = "$icon_sha"

          ssrfbm=$(curl -s --max-time 5 -b compose-cookies.txt -H 'Content-Type: application/json' \
            -d '{"name":"SSRF","wan_url":"http://169.254.169.254/latest/meta-data/"}' \
            http://127.0.0.1:18090/api/admin/bookmarks)
          sid=$(echo "$ssrfbm" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          ssrf=$(curl -s --max-time 10 -b compose-cookies.txt -X POST -o ssrf.json -w '%{http_code}' \
            "http://127.0.0.1:18090/api/admin/bookmarks/$sid/favicon")
          echo "ssrf favicon HTTP $ssrf body=$(cat ssrf.json)" | tee -a ci-artifacts/icon-smoke.txt
          test "$ssrf" = "502"

          del=$(curl -s --max-time 5 -b compose-cookies.txt -X DELETE -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:18090/api/admin/bookmarks/$bid")
          echo "delete bookmark HTTP $del" | tee -a ci-artifacts/icon-smoke.txt
          test "$del" = "200"
          get3=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18090/api/bookmarks/$bid/icon")
          echo "icon after bookmark delete HTTP $get3" | tee -a ci-artifacts/icon-smoke.txt
          test "$get3" = "404"
          left=$(sudo ls -A .ci-compose/icons | wc -l)
          echo "icon files left: $left" | tee -a ci-artifacts/icon-smoke.txt
          test "$left" = "0"

          # P2.3 导入导出冒烟：导出 JSON → 预览 HTML（不写库）→ 确认执行 → HTML 导出 → 访客拒绝
          echo "--- transfer smoke ---" | tee -a ci-artifacts/transfer-smoke.txt
          exp=$(curl -s --max-time 5 -b compose-cookies.txt -o export.json -w '%{http_code}' \
            "http://127.0.0.1:18090/api/admin/bookmarks/export?format=json")
          echo "export json HTTP $exp" | tee -a ci-artifacts/transfer-smoke.txt
          test "$exp" = "200"
          python3 -c 'import json; d=json.load(open("export.json")); assert d["format"]=="localhub-bookmarks" and d["version"]==2, d; print("export count", d["count"])' | tee -a ci-artifacts/transfer-smoke.txt

          html_b64=$(printf '%s' '<!DOCTYPE NETSCAPE-Bookmark-file-1><DL><p><DT><H3>工作</H3><DL><p><DT><H3>项目</H3><DL><p><DT><A HREF="https://transfer.example.com/">Transfer</A></DL><p></DL><p></DL><p>' | base64 -w0)
          body=$(python3 -c 'import json,sys; print(json.dumps({"format":"auto","data_base64":sys.argv[1]}))' "$html_b64")
          before=$(curl -s --max-time 5 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/bookmarks | python3 -c 'import sys,json; print(json.load(sys.stdin)["total"])')
          pv=$(curl -s --max-time 5 -b compose-cookies.txt -H 'Content-Type: application/json' -d "$body" \
            -o preview.json -w '%{http_code}' http://127.0.0.1:18090/api/admin/bookmarks/import/preview)
          echo "import preview HTTP $pv" | tee -a ci-artifacts/transfer-smoke.txt
          test "$pv" = "200"
          python3 -c 'import json; d=json.load(open("preview.json")); assert d["total"]==1 and d["new"]==1 and d["items"][0]["folder_path"]==["工作","项目"], d; print("preview", d["total"], d["new"], d["items"][0]["folder_path"])' | tee -a ci-artifacts/transfer-smoke.txt
          after_pv=$(curl -s --max-time 5 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/bookmarks | python3 -c 'import sys,json; print(json.load(sys.stdin)["total"])')
          test "$before" = "$after_pv"

          ex=$(curl -s --max-time 5 -b compose-cookies.txt -H 'Content-Type: application/json' -d "$body" \
            -o import-exec.json -w '%{http_code}' http://127.0.0.1:18090/api/admin/bookmarks/import/execute)
          echo "import execute HTTP $ex" | tee -a ci-artifacts/transfer-smoke.txt
          test "$ex" = "200"
          python3 -c 'import json; d=json.load(open("import-exec.json")); assert d["created"]==1 and d["failed"]==0, d; print("created", d["created"])' | tee -a ci-artifacts/transfer-smoke.txt

          docker compose restart >/dev/null 2>&1
          health=000
          for i in $(seq 1 60); do
            health=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/health || true)
            [ "$health" = "200" ] && break
            sleep 1
          done
          echo "after restart /health HTTP $health" | tee -a ci-artifacts/transfer-smoke.txt
          test "$health" = "200"
          curl -s --max-time 5 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/bookmarks -o list-after-restart.json
          python3 -c 'import json; d=json.load(open("list-after-restart.json")); t=[i for i in d["items"] if i["name"]=="Transfer"]; assert len(t)==1 and t[0]["folder_path"]==["工作","项目"], d; print("restart folder", t[0]["folder_path"])' | tee -a ci-artifacts/transfer-smoke.txt

          eh=$(curl -s --max-time 5 -b compose-cookies.txt -o export.html -w '%{http_code}' \
            "http://127.0.0.1:18090/api/admin/bookmarks/export?format=html")
          echo "export html HTTP $eh" | tee -a ci-artifacts/transfer-smoke.txt
          test "$eh" = "200"
          grep -q 'NETSCAPE-Bookmark-file-1' export.html
          grep -q '<H3' export.html && grep -q '工作' export.html && grep -q '项目' export.html

          guest_exp=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:18090/api/admin/bookmarks/export?format=json")
          echo "guest export HTTP $guest_exp" | tee -a ci-artifacts/transfer-smoke.txt
          test "$guest_exp" = "401"

          # P5.1 V-02：在 LocalHub 的网络命名空间内，通过同一 Socket Proxy 发起写请求
          echo "--- P5.1 V-02 write rejection ---" | tee ci-artifacts/p51-v02.log
          mkdir -p ci-artifacts/p51-v02
          chmod 777 ci-artifacts/p51-v02
          docker run --rm --network container:localhub --entrypoint sh \
            -e P51_DOCKER_PROXY_URL=http://docker-socket-proxy:2375 \
            -e P51_ARTIFACT_DIR=/out \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/ci-artifacts/p51-v02:/out" \
            curlimages/curl:8.11.1 /scripts/p51-v02.sh 2>&1 | tee -a ci-artifacts/p51-v02.log
          test ${PIPESTATUS[0]} -eq 0
          docker compose logs --no-color docker-socket-proxy > ci-artifacts/p51-proxy.log 2>&1 || true
          test "$(docker ps -aq --filter name=p51fixture | wc -l)" = "0"
          test "$(docker network ls --filter name=p51net --format '{{.Name}}' | wc -l)" = "0"

          # Docker 不可用时：状态为连接失败，但首页、书签和健康检查仍正常
          echo "--- P5.1 Docker unavailable regression ---" | tee ci-artifacts/p51-outage.log
          docker stop localhub-docker-socket-proxy >/dev/null
          sleep 1
          outage_status=$(curl -s --max-time 8 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/docker/status)
          echo "status=$outage_status" | tee -a ci-artifacts/p51-outage.log
          echo "$outage_status" | grep -q '"status":"connection_failed"'
          outage_containers=$(curl -s --max-time 8 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/docker/containers)
          echo "containers=$outage_containers" | tee -a ci-artifacts/p51-outage.log
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["status"]=="connection_failed" and d["containers"]==[] and d["counts"]["stopped"]==0, d' "$outage_containers"
          outage_health=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/health)
          outage_bookmarks=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/api/bookmarks)
          echo "health=$outage_health bookmarks=$outage_bookmarks" | tee -a ci-artifacts/p51-outage.log
          test "$outage_health" = "200"
          test "$outage_bookmarks" = "200"
          docker start localhub-docker-socket-proxy >/dev/null
          recovered=0
          for i in $(seq 1 20); do
            recovered=$(curl -s --max-time 5 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/docker/status | grep -c '"status":"connected"' || true)
            [ "$recovered" = "1" ] && break
            sleep 1
          done
          echo "recovered=$recovered" | tee -a ci-artifacts/p51-outage.log
          test "$recovered" = "1"
          recovered_containers=$(curl -s --max-time 8 -b compose-cookies.txt http://127.0.0.1:18090/api/admin/docker/containers)
          echo "recovered_containers=$recovered_containers" | tee -a ci-artifacts/p51-outage.log
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["status"]=="connected" and any(c["name"]=="p52-running" and c["status"]=="running" for c in d["containers"]), d' "$recovered_containers"

          docker rm -f p52-running p52-stopped >/dev/null 2>&1 || true
          docker compose down 2>&1 | tee -a ci-artifacts/compose-up.txt
          test "$code" = "200"

      - name: 上传验证记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: ci-artifacts
          if-no-files-found: warn
